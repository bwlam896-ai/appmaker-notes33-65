name: Build, Sign & Release Android Packages (APK & AAB)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Prepare Project Structure & Clean Java Artifacts
        run: |
          # إزالة أي ملفات إعدادات kotlin معطوبة متراكمة مسبقاً لمنع خطأ Script compilation error
          rm -f settings.gradle.kts build.gradle.kts app/build.gradle.kts || true
          if [ -f "settings.gradle" ]; then
            sed -i 's/rootProject.name\s*=.*/rootProject.name = "notes33"/g' settings.gradle || true
            sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_SETTINGS/g' settings.gradle || true
          fi
          printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.2.2'\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'\n    }\n}\n\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle
          # تنظيف أي استيراد خاطئ لـ ViewBinding في كوتلن تلقائياً
          sed -i '/ActivityMain.*Binding/d' app/src/main/java/**/*.kt 2>/dev/null || true
          if ls app/src/main/java/**/*.kt 1> /dev/null 2>&1; then
            find app/src/main/java -type f -name "MainActivity.java" -delete || true
          fi
          mkdir -p app/src/main/assets/www
          if [ -f "preview.html" ] && [ ! -f "app/src/main/assets/www/index.html" ]; then
            cp -f preview.html app/src/main/assets/www/index.html
          fi
          if [ -f "privacy_policy.html" ]; then
            cp -f privacy_policy.html app/src/main/assets/www/privacy_policy.html || true
          fi
          rm -f preview.html || true
          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi drawable; do
            mkdir -p "app/src/main/res/$d"
          done
          if [ -f "app_icon.png" ] && [ -s "app_icon.png" ]; then
            for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp -f app_icon.png "app/src/main/res/$d/ic_launcher.png"
              cp -f app_icon.png "app/src/main/res/$d/ic_launcher_round.png"
            done
            cp -f app_icon.png app/src/main/res/drawable/splash_logo.png || true
          fi
          sed -i 's|@android:drawable/sym_def_app_icon|@mipmap/ic_launcher|g' app/src/main/AndroidManifest.xml || true
          sed -i 's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|g' app/src/main/AndroidManifest.xml || true
          sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml || true
          find app/src/main/res/layout -name "*.xml" | while read xmlFile; do
            sed -i 's/android:dir="[^"]*"//g' "$xmlFile" || true
            sed -i 's/app:layout_bottomToBottomOf/layout_bottomToBottomOf/g' "$xmlFile" || true
            sed -i 's/layout_bottomToBottomOf/app:layout_constraintBottom_toBottomOf/g' "$xmlFile" || true
          done
          mkdir -p keystore app
          if [ -f "keystore/release.keystore" ]; then
            echo "المفتاح الدائم موجود، سيتم اعتماده لضمان قبول التحديثات."
            cp keystore/release.keystore release.keystore
          else
            echo "توليد وتثبيت مفتاح التوقيع الدائم للتطبيق..."
            keytool -genkeypair -v -keystore keystore/release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass appmaker123 -keypass appmaker123 -dname "CN=AppMaker, OU=Mobile, O=AppMaker, L=Algiers, S=Algiers, C=DZ"
            cp keystore/release.keystore release.keystore
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/release.keystore
            git commit -m "حفظ مفتاح التوقيع الدائم للتطبيق [skip ci]" || true
            git push origin HEAD || true
          fi
          cp release.keystore app/release.keystore || true
          printf "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n" > gradle.properties

      - name: Compile and Assemble Android Packages
        run: |
          gradle assembleRelease bundleRelease -x lint -x test --stacktrace --no-daemon

      - name: Sign and Rename Android Packages
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          find app/build/outputs/apk/release -name "*.apk" | while read APK_FILE; do
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_FILE" aligned.apk || cp "$APK_FILE" aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:appmaker123 --key-pass pass:appmaker123 --out "notes33-v1.0.0.apk" aligned.apk
            break
          done
          find app/build/outputs/bundle/release -name "*.aab" | while read AAB_FILE; do
            cp "$AAB_FILE" "notes33-v1.0.0.aab"
            break
          done

      - name: Publish Release Packages to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0
          name: "notes33 v1.0.0 (Official Release)"
          files: |
            notes33-v1.0.0.apk
            notes33-v1.0.0.aab
            release.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
