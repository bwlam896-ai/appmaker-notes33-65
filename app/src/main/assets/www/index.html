<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة تطبيق الملاحظات الذكي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .phone-frame {
            width: 360px;
            height: 720px;
            background-color: #1e1e1e;
            border-radius: 40px;
            border: 8px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .status-bar {
            height: 24px;
            background-color: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            color: #888;
        }
        .app-bar {
            background-color: #6200ee;
            color: white;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .note-card {
            background-color: #2c2c2c;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-right: 4px solid #6200ee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .note-title {
            font-size: 16px;
            font-weight: bold;
            color: #bb86fc;
        }
        .note-body {
            font-size: 14px;
            color: #ccc;
        }
        .note-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
        }
        .actions-panel {
            padding: 12px;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #333;
        }
        .input-field {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #3700b3;
            color: white;
        }
        .btn-secondary {
            background-color: #03dac6;
            color: #121212;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span>10:42</span>
            <span>📶 🔋 100%</span>
        </div>
        <div class="app-bar">
            <span>ملاحظاتي الذكية</span>
            <span>⚙️</span>
        </div>
        <div class="content" id="notesList">
            <div class="note-card">
                <div class="note-title">ملاحظة تجريبية أولى</div>
                <div class="note-body">هذه محاكاة لتطبيق الملاحظات المصمم بلغة Kotlin وأندرويد الأصلي.</div>
                <div class="note-img">📷 معاينة الصورة المرفقة</div>
            </div>
        </div>
        <div class="actions-panel">
            <input type="text" id="noteTitleInput" class="input-field" placeholder="عنوان الملاحظة...">
            <input type="text" id="noteBodyInput" class="input-field" placeholder="اكتب محتوى الملاحظة هنا...">
            <div class="btn-row">
                <button class="btn" onclick="addNote()">إضافة ملاحظة</button>
                <button class="btn btn-secondary" onclick="simulateCamera()">التقاط شاشة</button>
                <button class="btn btn-secondary" onclick="simulateGallery()">استيراد صـورة</button>
            </div>
        </div>
    </div>
    <script>
        function addNote() {
            const titleInput = document.getElementById('noteTitleInput');
            const bodyInput = document.getElementById('noteBodyInput');
            if(!titleInput.value && !bodyInput.value) return;

            const list = document.getElementById('notesList');
            const card = document.createElement('div');
            card.className = 'note-card';
            card.innerHTML = `
                <div class="note-title">${titleInput.value || 'بدون عنوان'}</div>
                <div class="note-body">${bodyInput.value || ''}</div>
            `;
            list.prepend(card);
            titleInput.value = '';
            bodyInput.value = '';
        }
        function simulateCamera() {
            const list = document.getElementById('notesList');
            const card = document.createElement('div');
            card.className = 'note-card';
            card.innerHTML = `
                <div class="note-title">لقطة شاشة جديدة 📸</div>
                <div class="note-body">تم التقاط الشاشة بنجاح وإرفاقها بالملاحظة.</div>
                <div class="note-img" style="background:#333; color:#03dac6;">[صورة ملتقطة من الكاميرا]</div>
            `;
            list.prepend(card);
        }
        function simulateGallery() {
            const list = document.getElementById('notesList');
            const card = document.createElement('div');
            card.className = 'note-card';
            card.innerHTML = `
                <div class="note-title">صورة مستوردة 🖼️</div>
                <div class="note-body">تم اختيار صورة من المعرض المحلي.</div>
                <div class="note-img" style="background:#222; color:#bb86fc;">[صورة من المعرض]</div>
            `;
            list.prepend(card);
        }
    </script>
</body>
</html>
